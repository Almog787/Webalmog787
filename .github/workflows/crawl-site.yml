name: Deep Site Extractor for AI

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target website URL (including https://)"
        required: true
        type: string
      max_pages:
        description: "Maximum number of pages to crawl (1-200)"
        required: false
        default: "25"
        type: string
      max_depth:
        description: "Maximum link depth from root (0-5)"
        required: false
        default: "2"
        type: string
      viewports:
        description: "Viewports to capture"
        required: false
        default: "desktop+mobile"
        type: choice
        options:
          - desktop+mobile
          - desktop-only
      stealth_mode:
        description: "Browser stealth profile"
        required: false
        default: "chrome-xvfb"
        type: choice
        options:
          - chrome-xvfb
          - chromium-headless
      unpack_js:
        description: "Unpack JS bundles via SourceMaps, Webcrack, and Wakaru"
        required: false
        default: true
        type: boolean
      compress_output:
        description: "Tree-sitter compress unpacked JS in Repomix (layout/animations stay full)"
        required: false
        default: true
        type: boolean
      enable_katana:
        description: "Run Katana Go crawler for early endpoint & JS route discovery"
        required: false
        default: true
        type: boolean
      enable_purgecss:
        description: "Prune unused CSS rules via PurgeCSS before packing"
        required: false
        default: true
        type: boolean
      enable_singlefile:
        description: "Save offline self-contained HTML snapshot via SingleFile CLI"
        required: false
        default: true
        type: boolean
      token_budget:
        description: "Soft token warning threshold"
        required: false
        default: "180000"
        type: string

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup Go 1.23 (Katana & Wappalyzergo CLI)
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Setup Python 3.12 (Scrapling anti-bot fallback)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache npm, Playwright/Patchright browsers & Go tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
            ~/go/bin
          key: ${{ runner.os }}-tools-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      - name: Install engine dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Go recon CLIs (Katana & Wappalyzergo CLI)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          if ! command -v katana >/dev/null 2>&1; then
            go install github.com/projectdiscovery/katana/cmd/katana@latest || true
          fi
          if ! command -v wappalyzer-cli >/dev/null 2>&1; then
            go install -v github.com/boogah/wappalyzer-cli@main || true
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Scrapling anti-bot fallback (non-fatal)
        run: |
          python3 -m pip install --upgrade pip || true
          pip install "scrapling[fetchers]" || true
          scrapling install || true

      - name: Install Xvfb display server
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Patchright browsers (Chrome & Chromium)
        run: |
          npx patchright install-deps chromium
          npx patchright install chrome
          npx patchright install chromium

      - name: Install Dembrandt browser
        run: npx dembrandt install-browser

      - name: Run deterministic extraction engine
        env:
          TARGET_URL: ${{ inputs.target_url }}
          MAX_PAGES: ${{ inputs.max_pages }}
          MAX_DEPTH: ${{ inputs.max_depth }}
          VIEWPORTS: ${{ inputs.viewports }}
          STEALTH_MODE: ${{ inputs.stealth_mode }}
          UNPACK_JS: ${{ inputs.unpack_js }}
          COMPRESS_OUTPUT: ${{ inputs.compress_output }}
          ENABLE_KATANA: ${{ inputs.enable_katana }}
          ENABLE_PURGECSS: ${{ inputs.enable_purgecss }}
          ENABLE_SINGLEFILE: ${{ inputs.enable_singlefile }}
          TOKEN_BUDGET: ${{ inputs.token_budget }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          EXTRACTED_DIR: ./extracted
          CRAWLEE_STORAGE_DIR: ./storage
          CRAWLEE_MEMORY_MBYTES: "5120"
          SNAPSHOT_OUT_PATH: extractions/snapshots/snapshot-run-${{ github.run_number }}-${{ github.run_attempt }}.html
        run: |
          if [ "${{ inputs.stealth_mode }}" = "chrome-xvfb" ]; then
            stdbuf -oL -eL xvfb-run -a --server-args="-screen 0 1440x900x24" npm run crawl
          else
            stdbuf -oL -eL npm run crawl
          fi

      - name: Pack all extracted data into single AI context text file
        run: |
          mkdir -p extractions
          OUT_FILE="extractions/ai-site-context-run-${{ github.run_number }}-${{ github.run_attempt }}.txt"
          CONFIG_FILE="repomix.config.json"
          if [ "${{ inputs.compress_output }}" = "false" ]; then
            CONFIG_FILE="repomix.full.config.json"
          fi
          stdbuf -oL -eL npx repomix ./extracted --config "$CONFIG_FILE" --no-gitignore --style xml --output "$OUT_FILE" --token-count-tree 1000
          BYTES=$(wc -c < "$OUT_FILE")
          MB=$(awk "BEGIN {printf \"%.2f\", $BYTES / (1024*1024)}")
          EST_TOKENS=$((BYTES / 4))
          {
            echo "### Deterministic Site Extraction Complete"
            echo "- **Target URL:** ${{ inputs.target_url }}"
            echo "- **Repository Path:** \`$OUT_FILE\`"
            echo "- **Size:** $BYTES bytes ($MB MB, ~$EST_TOKENS estimated tokens)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$EST_TOKENS" -gt "${{ inputs.token_budget }}" ]; then
            echo "::warning::Estimated tokens ($EST_TOKENS) exceeded TOKEN_BUDGET (${{ inputs.token_budget }})."
            echo "- **Budget Warning:** Exceeded \`${{ inputs.token_budget }}\` tokens. Re-run with smaller \`max_pages\` for high-precision slices." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit extracted output & snapshot to repository folder
        run: |
          OUT_FILE="extractions/ai-site-context-run-${{ github.run_number }}-${{ github.run_attempt }}.txt"
          SNAP_FILE="extractions/snapshots/snapshot-run-${{ github.run_number }}-${{ github.run_attempt }}.html"
          MAX_GIT_BYTES=$((95 * 1024 * 1024))
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${{ github.ref_name }}" || true
          if [ -f "$OUT_FILE" ]; then
            BYTES=$(wc -c < "$OUT_FILE")
            if [ "$BYTES" -le "$MAX_GIT_BYTES" ]; then
              git add "$OUT_FILE"
            else
              echo "::warning::Context file ($BYTES bytes) exceeds 95 MB Git push limit; available in Artifacts."
            fi
          fi
          if [ -f "$SNAP_FILE" ]; then
            SNAP_BYTES=$(wc -c < "$SNAP_FILE")
            if [ "$SNAP_BYTES" -le "$MAX_GIT_BYTES" ]; then
              git add "$SNAP_FILE"
            fi
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(extract): save run #${{ github.run_number }}-${{ github.run_attempt }} (${{ inputs.target_url }})"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Upload unified AI context text file (unzipped)
        uses: actions/upload-artifact@v7
        with:
          path: extractions/ai-site-context-run-${{ github.run_number }}-${{ github.run_attempt }}.txt
          archive: false
          if-no-files-found: error
          retention-days: 3
